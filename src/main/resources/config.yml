# Ziplines configuration.
#
# Everything under "defaults" is what a newly created zipline starts with. Existing ziplines keep
# their own settings, which live in ziplines.yml and are changed in game with /zl edit.
#
# Invalid values are reported in the server log on startup and fall back to the built-in default.

defaults:
  # Ride speed multiplier, from 0.01 to 10. 1.0 works out at about 8 blocks per second.
  speed: 1.0

  # How the line is drawn: BLOCK places real blocks while the server is running, PARTICLE draws it
  # without touching the world at all.
  path-type: BLOCK
  # Block used when path-type is BLOCK.
  material: OAK_FENCE
  # Particle used when path-type is PARTICLE.
  path-particle: CLOUD
  # Particle circling each end of the line, marking where it can be boarded.
  endpoint-particle: END_ROD

  # What starts a ride: WALK into the end of the line, or RIGHT_CLICK near it.
  trigger: WALK
  # Which ends the line can be boarded from: BOTH, START_TO_END for one way from where the line
  # was started, or END_TO_START for one way from where it was finished. The end a one way line
  # cannot be boarded from shows no endpoint particles and no seat.
  direction: BOTH
  # How the rider is carried: MOUNTED puts them on a seat, VELOCITY pushes them along.
  movement-mode: MOUNTED
  # What happens at the far end: DROP lets them fall, LAUNCH throws them onwards.
  exit-mode: DROP
  # Strength of the throw when exit-mode is LAUNCH, from 0 to 10.
  launch-power: 1.5

  # Sound played while riding, or NONE for silence. Pitch slides from start to end over the ride.
  ride-sound: BLOCK_NOTE_BLOCK_BASS
  ride-sound-volume: 0.5
  # Ticks between repeats of the ride sound, from 1 to 100.
  ride-sound-interval: 2
  ride-sound-pitch-start: 0.5
  ride-sound-pitch-end: 2.0

  # Sound played on reaching the end, or NONE for silence.
  end-sound: ENTITY_ENDER_DRAGON_FLAP
  end-sound-volume: 1.0
  end-sound-pitch: 1.0

  # Show a seat under the rider, and at each end of the line that can be boarded from.
  seat: true
  # Block the seat is made of. Slabs sit best under a rider.
  seat-material: OAK_SLAB
  # Size of the seat block, from 0.05 to 2.
  seat-scale: 0.8
  # Nudge the seat up or down, from -2 to 2.
  seat-offset: 0.0

  # Take fall damage from the drop at the end of a ride.
  fall-damage: false
  # Let riders leave the line early by sneaking.
  sneak-exit: false

# How close to an endpoint a player has to be for the trigger to fire, in blocks. Minimum 0.5.
trigger-radius: 1.5

# Longest zipline that may be built, in blocks. Minimum 2.
max-length: 256
