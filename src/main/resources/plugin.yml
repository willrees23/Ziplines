name: ${project.name}
version: ${project.version}
description: ${project.description}
website: ${project.url}
author: Will Rees
main: com.github.willrees23.ZiplinesPlugin
api-version: 26.2

permissions:
  ziplines.use:
    description: Ride a zipline.
    default: true
  ziplines.start:
    description: Begin marking out a zipline.
    default: op
  ziplines.end:
    description: Finish marking out a zipline.
    default: op
  ziplines.delete:
    description: Delete a zipline and restore the blocks its path replaced.
    default: op
  ziplines.edit:
    description: Change the settings of an existing zipline.
    default: op
  ziplines.list:
    description: List the ziplines on the server.
    default: op
  ziplines.admin:
    description: Full control over ziplines.
    default: op
    children:
      ziplines.use: true
      ziplines.start: true
      ziplines.end: true
      ziplines.delete: true
      ziplines.edit: true
      ziplines.list: true
