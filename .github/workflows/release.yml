name: Release

# Fires when the release pull request is merged. The version in pom.xml is already
# the right one by then, having been raised on dev by the Prepare release workflow,
# so this only has to tag it, build it and publish it.
#
# Nothing is ever committed to main, which is why main and dev cannot drift apart.

on:
  push:
    branches: [ main ]
  # A manual run re-attempts the release for whatever main currently holds. It is
  # there for the case where publishing failed after the merge had already landed.
  workflow_dispatch:

# The tag is pushed to main; no commit is.
permissions:
  contents: write

# Never cut two releases at once; a second run waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to tell an unreleased version from one already out,
          # and the full history is needed for the release notes diff.
          fetch-depth: 0
          # RELEASE_TOKEN is only required if the tags are protected; without the
          # secret this falls back to the built-in token.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Read the version, and decide whether it needs releasing
        id: version
        run: |
          set -euo pipefail

          version=$(mvn --batch-mode --no-transfer-progress help:evaluate \
                      -Dexpression=project.version -q -DforceStdout)
          version=${version%-SNAPSHOT}
          echo "POM version: $version"

          # The tag is the record of what has shipped. A push to main that leaves
          # the version alone is a push that has already been released, so it is
          # skipped; one that raises it — a merged release PR, or a hand-bumped
          # hotfix — is released. No pull request lookup is needed to tell them apart.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} has already been released; there is nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing ${version}."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A failure here means no tag and no release.
      - name: Build and test
        if: steps.version.outputs.release == 'true'
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag -a "v${VERSION}" -m "Ziplines v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          jar="target/Ziplines-${VERSION}.jar"
          [ -f "$jar" ] || { echo "::error::$jar was not built."; exit 1; }

          gh release create "v${VERSION}" "$jar" \
            --title "Ziplines v${VERSION}" \
            --generate-notes
